<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>Otopark Hatırlatıcı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f6fa; --card: #fff; --text: #1b1f24; --muted: #667085;
    --primary: #1565c0; --danger: #c62828; --border: #e3e7ee;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1c2128; --text: #e8ecf1; --muted: #9aa4b2;
            --primary: #4f9cf0; --danger: #ef5350; --border: #2b323c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Roboto, sans-serif;
         background: var(--bg); color: var(--text); padding: 16px;
         padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  header h1 { font-size: 1.3rem; margin: 0; }
  .logo { width: 36px; height: 36px; border-radius: 9px; }
  .capture { display: block; width: 100%; padding: 22px; font-size: 1.25rem; font-weight: 700;
             border: 0; border-radius: 16px; background: var(--primary); color: #fff;
             cursor: pointer; box-shadow: 0 4px 14px rgba(21,101,192,.35); }
  .capture:active { transform: scale(.98); }
  .hint { color: var(--muted); font-size: .9rem; text-align: center; margin: 10px 0 20px; }
  .list { display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .card img { display: block; width: 100%; max-height: 60vh; object-fit: contain; background: #000; cursor: zoom-in; }
  .meta { padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .meta .info { flex: 1; min-width: 150px; }
  .date { font-weight: 600; }
  .left { color: var(--muted); font-size: .85rem; }
  .note { width: 100%; margin-top: 8px; padding: 10px; font-size: 1rem; border-radius: 10px;
          border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .del { border: 1px solid var(--danger); color: var(--danger); background: transparent;
         border-radius: 10px; padding: 8px 12px; font-size: .95rem; cursor: pointer; }
  .latest { display: inline-block; background: var(--primary); color: #fff; font-size: .75rem;
            padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  #viewer { position: fixed; inset: 0; background: #000; display: none; z-index: 10;
            align-items: center; justify-content: center; }
  #viewer.open { display: flex; }
  #viewer img { max-width: 100%; max-height: 100%; }
  #viewer button { position: absolute; top: 14px; right: 14px; font-size: 1.4rem; width: 44px; height: 44px;
                   border-radius: 50%; border: 0; background: rgba(255,255,255,.2); color: #fff; }
</style>
</head>
<body>
<header>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Otopark Hatırlatıcı</h1>
</header>

<button class="capture" id="captureBtn">📷 Fotoğraf Çek</button>
<input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
<p class="hint">Fotoğraflar 7 gün sonra otomatik silinir.</p>

<div class="list" id="list"></div>

<div id="viewer"><img alt=""><button aria-label="Kapat">✕</button></div>

<script>
const DAY = 24 * 60 * 60 * 1000;
const KEEP = 7 * DAY;
let db;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('otopark', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode) { return db.transaction('photos', mode).objectStore('photos'); }
function req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function cleanup() {
  const all = await req(tx('readonly').getAll());
  const now = Date.now();
  for (const p of all) if (now - p.time > KEEP) await req(tx('readwrite').delete(p.id));
}

// Fotoğrafı küçült (depolama tasarrufu)
function resize(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

function fmtDate(t) {
  return new Date(t).toLocaleString('tr-TR', { day: '2-digit', month: 'long', hour: '2-digit', minute: '2-digit' });
}
function fmtLeft(t) {
  const ms = t + KEEP - Date.now();
  const d = Math.floor(ms / DAY), h = Math.floor((ms % DAY) / 3600000);
  return d > 0 ? `${d} gün ${h} saat sonra silinecek` : `${Math.max(h, 0)} saat sonra silinecek`;
}

const urls = [];
async function render() {
  urls.splice(0).forEach(u => URL.revokeObjectURL(u));
  const all = (await req(tx('readonly').getAll())).sort((a, b) => b.time - a.time);
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!all.length) {
    list.innerHTML = '<div class="empty">Henüz fotoğraf yok.<br>Aracını park edince park yeri numarasının fotoğrafını çek.</div>';
    return;
  }
  all.forEach((p, i) => {
    const u = URL.createObjectURL(p.blob); urls.push(u);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${u}" alt="Park fotoğrafı">
      <div class="meta">
        <div class="info">
          <div class="date">${fmtDate(p.time)}${i === 0 ? '<span class="latest">Son</span>' : ''}</div>
          <div class="left">${fmtLeft(p.time)}</div>
        </div>
        <button class="del">Sil</button>
        <input class="note" placeholder="Not ekle (ör. B2 kat, 45 no)">
      </div>`;
    const note = card.querySelector('.note');
    note.value = p.note || '';
    note.addEventListener('change', async () => { p.note = note.value; await req(tx('readwrite').put(p)); });
    card.querySelector('img').addEventListener('click', () => openViewer(u));
    card.querySelector('.del').addEventListener('click', async () => {
      if (confirm('Bu fotoğraf silinsin mi?')) { await req(tx('readwrite').delete(p.id)); render(); }
    });
    list.appendChild(card);
  });
}

function openViewer(u) {
  const v = document.getElementById('viewer');
  v.querySelector('img').src = u; v.classList.add('open');
}
document.getElementById('viewer').addEventListener('click', e => e.currentTarget.classList.remove('open'));

const input = document.getElementById('fileInput');
document.getElementById('captureBtn').addEventListener('click', () => input.click());
input.addEventListener('change', async () => {
  const f = input.files[0];
  input.value = '';
  if (!f) return;
  const blob = await resize(f);
  await req(tx('readwrite').add({ blob, time: Date.now(), note: '' }));
  render();
});

(async () => {
  db = await openDB();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  await cleanup();
  render();
  document.addEventListener('visibilitychange', async () => {
    if (!document.hidden) { await cleanup(); render(); }
  });
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
